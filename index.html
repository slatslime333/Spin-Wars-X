<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Spin War X</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Menu -->
    <main class="menu">

        <div class="logo">
            <div class="logo-icon">⚔</div>

            <h1>SPIN WAR X</h1>

            <p>Spinning Top Battle Simulator</p>
        </div>

        <section class="menu-card">

            <h2>Choose Battle</h2>

            <button class="menu-btn bronze" data-mode="bronze">
                🟫 Bronze
            </button>

            <button class="menu-btn silver" data-mode="silver">
                🥈 Silver
            </button>

            <button class="menu-btn gold" data-mode="gold">
                🥇 Gold / 💎 Diamond
            </button>

            <button class="menu-btn custom" data-mode="custom">
                ⚙ Custom
            </button>

        </section>

        <footer>

            <span>Version 0.0.2</span>

        </footer>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
