<script>
/* Presentation-only SVG safeguard. Preserve the renderer's intrinsic aspect
   ratio even when the surrounding viewport changes between phone/desktop. */
(function(){
  function fitBattleSvg(){
    var svg=document.getElementById('newBattleSvg');
    if(!svg) return;
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.style.objectFit='contain';
    svg.style.objectPosition='center';
  }
  window.addEventListener('resize',fitBattleSvg,{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(fitBattleSvg,50);},{passive:true});
  new MutationObserver(fitBattleSvg).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(fitBattleSvg,0);
})();
if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
}
</script>
